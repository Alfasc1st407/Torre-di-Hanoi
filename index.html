<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gioco Torre di Hanoi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .disk {
      height: 30px;
      margin: 4px auto;
      border-radius: 6px;
      text-align: center;
      color: white;
      font-weight: bold;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }
    .tower.selected {
      outline: 3px solid #3b82f6;
      outline-offset: -3px;
    }
    .disk.lifted {
      transform: translateY(-10px);
    }
    .victory-message {
      font-size: 3rem;
      font-weight: bold;
      color: red;
      text-align: center;
      margin-top: 2rem;
      white-space: pre-line;
    }
  </style>
</head>
<body class="bg-gray-100 p-8 font-sans">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-center mb-6">Gioco della Torre di Hanoi</h1>
    <div class="flex items-center justify-center mb-4">
      <label class="mr-2">Numero di anelli:</label>
      <input id="diskCount" type="number" value="3" min="1" max="8" class="border p-2 w-20 rounded">
      <button onclick="startGame()" class="ml-4 px-4 py-2 bg-blue-600 text-white rounded">Inizia</button>
    </div>
    <div class="text-center mb-4">
      <p id="minMoves" class="font-medium">Mosse minime: 0</p>
      <p id="moveCounter" class="font-medium">Mosse effettuate: 0</p>
      <p id="timer" class="font-medium">Tempo: 00:00:00.00</p>
      <button onclick="undoMove()" class="mt-2 px-4 py-2 bg-red-500 text-white rounded">Annulla mossa</button>
    </div>
    <div id="game" class="flex justify-center space-x-2 mt-6">
      <div class="tower bg-white shadow p-2 rounded w-1/4" onclick="selectTower(0)">
        <div class="text-center mb-2 font-semibold">Torre 1</div>
        <div id="tower0" class="h-80 flex flex-col-reverse items-center"></div>
      </div>
      <div class="tower bg-white shadow p-2 rounded w-1/4" onclick="selectTower(1)">
        <div class="text-center mb-2 font-semibold">Torre 2</div>
        <div id="tower1" class="h-80 flex flex-col-reverse items-center"></div>
      </div>
      <div class="tower bg-white shadow p-2 rounded w-1/4" onclick="selectTower(2)">
        <div class="text-center mb-2 font-semibold">Torre 3</div>
        <div id="tower2" class="h-80 flex flex-col-reverse items-center"></div>
      </div>
    </div>
    <p id="status" class="text-center mt-6 text-lg font-medium"></p>
    <div id="victory" class="victory-message hidden"></div>

    <div class="mt-10">
      <h2 class="text-xl font-semibold text-center mb-2">Classifica (per numero di anelli)</h2>
      <ul id="leaderboard" class="max-w-md mx-auto bg-white rounded shadow p-4 text-sm space-y-2 text-gray-700"></ul>
    </div>
  </div>

  <script>
    let towers = [[], [], []];
    let selectedTower = null;
    let diskCount = 3;
    let moveHistory = [];
    let moveCounter = 0;
    let timerInterval;
    let startTime;
    let timerStarted = false;

    function formatTime(ms) {
      const h = Math.floor(ms / 3600000).toString().padStart(2, '0');
      const m = Math.floor((ms % 3600000) / 60000).toString().padStart(2, '0');
      const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
      const cs = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
      return `${h}:${m}:${s}.${cs}`;
    }

    function updateTimer() {
      const now = new Date();
      const elapsed = now - startTime;
      document.getElementById("timer").textContent = `Tempo: ${formatTime(elapsed)}`;
    }

    function startTimer() {
      startTime = new Date();
      updateTimer();
      timerInterval = setInterval(updateTimer, 10);
      timerStarted = true;
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerStarted = false;
    }

    function updateLeaderboard() {
      const results = JSON.parse(localStorage.getItem(`hanoi_${diskCount}`)) || [];
      const leaderboard = document.getElementById("leaderboard");
      leaderboard.innerHTML = "";
      if (results.length === 0) {
        leaderboard.innerHTML = `<li class="text-center text-gray-400">Nessun risultato ancora salvato per ${diskCount} anelli.</li>`;
        return;
      }
      results.slice(0, 5).forEach((entry, index) => {
        const time = formatTime(entry.time);
        const li = document.createElement("li");
        li.innerHTML = `<strong>#${index + 1}</strong> - Tempo: <span class="font-mono">${time}</span>`;
        leaderboard.appendChild(li);
      });
    }

    function startGame() {
      clearInterval(timerInterval);
      timerStarted = false;
      document.getElementById("timer").textContent = "Tempo: 00:00:00.00";
      diskCount = parseInt(document.getElementById("diskCount").value);
      towers = [[], [], []];
      for (let i = diskCount; i >= 1; i--) {
        towers[0].push(i);
      }
      selectedTower = null;
      moveHistory = [];
      moveCounter = 0;
      document.getElementById("victory").classList.add("hidden");
      updateDisplay();
      document.getElementById("status").textContent = "Gioca! Sposta tutti gli anelli in una sola torre (2 o 3).";
      document.getElementById("minMoves").textContent = `Mosse minime: ${Math.pow(2, diskCount) - 1}`;
      document.getElementById("moveCounter").textContent = `Mosse effettuate: ${moveCounter}`;
      updateLeaderboard();
    }

    function updateDisplay() {
      document.querySelectorAll('.tower').forEach(t => t.classList.remove('selected'));
      for (let i = 0; i < 3; i++) {
        const towerDiv = document.getElementById("tower" + i);
        towerDiv.innerHTML = "";
        towers[i].forEach((size, idx, arr) => {
          const disk = document.createElement("div");
          disk.className = "disk";
          if (selectedTower === i && idx === arr.length - 1) {
            disk.classList.add("lifted");
          }
          disk.style.width = `${size * 20}px`;
          disk.style.backgroundColor = `hsl(${size * 40}, 70%, 50%)`;
          disk.textContent = size;
          towerDiv.appendChild(disk);
        });
      }
      if (selectedTower !== null) {
        document.querySelectorAll(".tower")[selectedTower].classList.add("selected");
      }
    }

    function selectTower(index) {
      if (selectedTower === null) {
        if (towers[index].length === 0) return;
        selectedTower = index;
        document.getElementById("status").textContent = `Torre selezionata: ${index + 1}`;
      } else if (selectedTower === index) {
        selectedTower = null;
        document.getElementById("status").textContent = "Selezione annullata.";
      } else {
        const from = towers[selectedTower];
        const to = towers[index];
        if (to.length === 0 || from[from.length - 1] < to[to.length - 1]) {
          if (!timerStarted) startTimer();
          const diskSize = from[from.length - 1];
          moveHistory.push({ from: selectedTower, to: index, disk: diskSize });
          to.push(from.pop());
          moveCounter++;
          document.getElementById("moveCounter").textContent = `Mosse effettuate: ${moveCounter}`;
          if (towers[1].length === diskCount || towers[2].length === diskCount) {
            stopTimer();
            const elapsed = new Date() - startTime;
            const minMoves = Math.pow(2, diskCount) - 1;
            const message = moveCounter === minMoves ? "Perfetto!!" : "Ottimo";
            document.getElementById("victory").textContent = `${message}\nTempo impiegato: ${formatTime(elapsed)}`;
            document.getElementById("victory").classList.remove("hidden");
            document.getElementById("status").textContent = "Gioco completato.";
            if (moveCounter === minMoves) saveResult(elapsed);
          }
        } else {
          document.getElementById("status").textContent = "Mossa non valida.";
        }
        selectedTower = null;
      }
      updateDisplay();
    }

    function saveResult(elapsed) {
      let results = JSON.parse(localStorage.getItem(`hanoi_${diskCount}`)) || [];
      results.push({ time: elapsed, moves: moveCounter });
      results.sort((a, b) => a.time - b.time);
      localStorage.setItem(`hanoi_${diskCount}`, JSON.stringify(results));
      updateLeaderboard();
    }

    function undoMove() {
      if (moveHistory.length === 0) {
        document.getElementById("status").textContent = "Nessuna mossa da annullare.";
        return;
      }
      const lastMove = moveHistory.pop();
      const { from, to, disk } = lastMove;
      if (towers[to].pop() === disk) {
        towers[from].push(disk);
        moveCounter--;
        document.getElementById("moveCounter").textContent = `Mosse effettuate: ${moveCounter}`;
        document.getElementById("status").textContent = `Mossa annullata. Puoi continuare.`;
        updateDisplay();
      }
    }

    window.onload = startGame;
  </script>
</body>
</html>
